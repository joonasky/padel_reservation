version: "3.8"

services:
  db:
    image: postgres:18 # Using the latest major version (2025/2026 release)
    container_name: database
    restart: unless-stopped
    environment:
      - POSTGRES_USER=pguser
      - POSTGRES_PASSWORD=securepassword123
      - POSTGRES_DB=dev_db
    ports:
      - "5432:5432"
    volumes:
      # This local folder will be created automatically in your project directory
      - ./pg18_data:/var/lib/postgresql

volumes:
  pg18_data:

networks:
  default:
    name: rpadel-reservation-network
